name: CI

# Pull requests run this directly. Pushes to main run it through deploy.yml (workflow_call),
# so a merge is checked once and only deploys when it passes.
on:
  pull_request:
  workflow_call:

concurrency:
  # New pushes to a PR cancel its stale run; calls from a deploy are never cancelled here.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web-and-api:
    name: API + Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techbuddy
          POSTGRES_PASSWORD: techbuddy
          POSTGRES_DB: techbuddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techbuddy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://techbuddy:techbuddy@localhost:5432/techbuddy?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API e2e (real Postgres)
        run: pnpm --filter api test:e2e
      - name: Production builds
        run: pnpm build
        env:
          API_URL: http://localhost:4000

  docker:
    name: Docker image (${{ matrix.app }})
    # Catches a broken Dockerfile before merge. Deploys build and push for real.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: (cd packages/flutter_guardian && dart pub get)
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
