name: Deploy

# Every push to main (a merged PR) runs CI, publishes images and deploys them. A run can also
# be started by hand from the Actions tab, e.g. to redeploy after fixing server settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in merge order. A newer merge waits instead of cancelling a deploy
# that is half-way through migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  images:
    name: Image (${{ matrix.app }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        # GHCR names must be lowercase.
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/tech-buddy-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Secrets and protection rules (e.g. required reviewers) live on this environment.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tech-buddy' }}
    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo "::warning title=Deploy skipped::Images were published, but the production environment has no DEPLOY_HOST/DEPLOY_USER secrets yet. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'

      - name: Configure SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: refuse to talk to anything that isn't the real server.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Upload stack files
        if: steps.settings.outputs.ready == 'true'
        run: |
          ssh production "mkdir -p '$DEPLOY_PATH'"
          scp deploy/compose.prod.yml deploy/Caddyfile deploy/deploy.sh "production:$DEPLOY_PATH/"

      - name: Roll out ${{ github.sha }}
        if: steps.settings.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # The token goes over stdin, never on a command line.
          printf '%s' "$GHCR_TOKEN" | ssh production "docker login $REGISTRY -u '${{ github.actor }}' --password-stdin"
          ssh production "cd '$DEPLOY_PATH' && chmod +x deploy.sh && \
            IMAGE_TAG='${{ github.sha }}' \
            API_IMAGE='$REGISTRY/$owner/tech-buddy-api' \
            WEB_IMAGE='$REGISTRY/$owner/tech-buddy-web' \
            ./deploy.sh"

      - name: Sign out of the registry
        if: always() && steps.settings.outputs.ready == 'true'
        run: ssh production "docker logout $REGISTRY" || true

      - name: Smoke test
        if: steps.settings.outputs.ready == 'true' && vars.SITE_URL != ''
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 6 \
            "${{ vars.SITE_URL }}/api/health"
          curl --fail --silent --show-error --output /dev/null "${{ vars.SITE_URL }}/"

  android:
    name: Android release APK
    needs: ci
    # Skipped until the app has an API to point at.
    if: vars.SITE_URL != '' || vars.MOBILE_API_BASE_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # The app talks to the deployed API; override with MOBILE_API_BASE_URL if it lives elsewhere.
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || format('{0}/api', vars.SITE_URL) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning title=Debug-signed APK::Add the ANDROID_KEYSTORE_* secrets to sign release builds. See apps/mobile/README.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: (cd packages/flutter_guardian && dart pub get)
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: tech-buddy-android-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
