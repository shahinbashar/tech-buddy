services:
  postgres:
    image: postgres:16-alpine
    container_name: techbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techbuddy}
      POSTGRES_DB: ${POSTGRES_DB:-techbuddy}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - techbuddy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-techbuddy}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  techbuddy-pgdata:
