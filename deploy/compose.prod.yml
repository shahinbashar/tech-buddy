# Production stack: PostgreSQL, API, web and Caddy (automatic HTTPS).
#
# Runs on the deploy server from the directory that holds this file, `Caddyfile`, `deploy.sh`
# and a `.env` (see `.env.example`). The deploy workflow uploads the first three and calls
# deploy.sh with the image tag to run, so the server only ever pulls pre-built images.

name: tech-buddy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-techbuddy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-techbuddy} -d ${POSTGRES_DB:-techbuddy}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published: only the API reaches the database, over the Compose network.

  api:
    image: ${API_IMAGE:?Set API_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Use a URL-safe POSTGRES_PASSWORD (e.g. hex) — it is embedded in this URL as-is.
      DATABASE_URL: postgresql://${POSTGRES_USER:-techbuddy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-techbuddy}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Caddy is the only proxy in front of the API.
      TRUST_PROXY_HOPS: 1
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Only read by the one-off seed command (see deploy/README.md).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Site Admin}
      SEED_DEMO_CONTENT: 'false'
    volumes:
      - uploads:/data/uploads

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side fetches from Next.js go straight to the API container.
      API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
